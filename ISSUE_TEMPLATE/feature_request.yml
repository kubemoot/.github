name: Feature request
description: Something you want that does not exist yet.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "A specific repository has the better form: [kubemoot/kubemoot](https://github.com/kubemoot/kubemoot/issues/new/choose), [kubemoot/kmctl](https://github.com/kubemoot/kmctl/issues/new/choose), [kubemoot/vscode-crewforge](https://github.com/kubemoot/vscode-crewforge/issues/new/choose), or [kubemoot/crews](https://github.com/kubemoot/crews/issues/new/choose). Use this form only if none of them fits."
  - type: checkboxes
    id: searched
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and discussions and did not find this one
          required: true
  - type: input
    id: component
    attributes:
      label: Which project
      placeholder: The component or repository the idea is for
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Describe the situation you are in, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
      description: "A rough shape is fine; this does not need to be a full design."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

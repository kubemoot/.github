<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Kubemoot (for dark backgrounds): a round table with water drops gathered around it">
  <title>Kubemoot</title>
  <!-- No background: the mark sits on whatever is behind it. -->
  <!-- The table: a round table, seen from above. -->
  <circle cx="100" cy="100" r="40" fill="#e5e7eb"/>
  <circle cx="100" cy="100" r="32" fill="none" stroke="#1f2a37" stroke-width="2.5" opacity="0.9"/>
  <!-- The moot: drops around the table, each pointed at its center. -->
  <g fill="#3b82f6">
    <path d="M0 0 C 11 -14, 11 -34, 0 -34 C -11 -34, -11 -14, 0 0 Z" transform="rotate(0 100 100) translate(100 54)"/>
    <path d="M0 0 C 11 -14, 11 -34, 0 -34 C -11 -34, -11 -14, 0 0 Z" transform="rotate(45 100 100) translate(100 54)"/>
    <path d="M0 0 C 11 -14, 11 -34, 0 -34 C -11 -34, -11 -14, 0 0 Z" transform="rotate(90 100 100) translate(100 54)"/>
    <path d="M0 0 C 11 -14, 11 -34, 0 -34 C -11 -34, -11 -14, 0 0 Z" transform="rotate(135 100 100) translate(100 54)"/>
    <path d="M0 0 C 11 -14, 11 -34, 0 -34 C -11 -34, -11 -14, 0 0 Z" transform="rotate(180 100 100) translate(100 54)"/>
    <path d="M0 0 C 11 -14, 11 -34, 0 -34 C -11 -34, -11 -14, 0 0 Z" transform="rotate(225 100 100) translate(100 54)"/>
    <path d="M0 0 C 11 -14, 11 -34, 0 -34 C -11 -34, -11 -14, 0 0 Z" transform="rotate(270 100 100) translate(100 54)"/>
    <path d="M0 0 C 11 -14, 11 -34, 0 -34 C -11 -34, -11 -14, 0 0 Z" transform="rotate(315 100 100) translate(100 54)"/>
  </g>
</svg>
